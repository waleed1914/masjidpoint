<!doctype html><html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masjid Shop — MasjidPoint</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site-nav.css?v=1"><link rel="stylesheet" href="masjid-shop.css">  <link rel="stylesheet" href="mobile.css?v=1">
  <script src="sha256.js?v=1"></script>
  <link rel="stylesheet" href="loader.css?v=1">
  <script src="loader.js?v=1"></script>
</head><body class="shop-page"><header data-site-nav></header><script src="site-nav.js?v=1"></script><section class="shop-hero"><p class="eyebrow light"><span></span> Mosque collection shop</p><h1 id="shop-masjid-name"></h1><p id="shop-hero-note">Order online from your selected mosque.</p><ul class="shop-ways" id="shop-ways" hidden></ul></section><main class="shop-content"><div class="shop-tools">
  <label class="shop-search-field"><span aria-hidden="true">⌕</span><input id="shop-search" type="search" placeholder="Search products"></label>
  <select id="shop-category" aria-label="Category"><option value="all">All categories</option></select>
  <select id="shop-price" aria-label="Price range">
    <option value="all">Any price</option>
    <option value="0-10">Under £10</option>
    <option value="10-25">£10 – £25</option>
    <option value="25-50">£25 – £50</option>
    <option value="50-">£50 and over</option>
  </select>
  <select id="shop-sort" aria-label="Sort products">
    <option value="featured">Sort: featured</option>
    <option value="price-asc">Price: low to high</option>
    <option value="price-desc">Price: high to low</option>
    <option value="name">Name A–Z</option>
  </select>
  <button type="button" id="shop-clear">Clear</button>
  <p class="shop-result-count" id="shop-result-count"></p>
</div><section class="product-grid" id="public-products"></section><div class="shop-empty" id="shop-empty" hidden><h2>No products available</h2><p>This mosque shop does not currently have any visible products in stock.</p></div></main><div class="cart-drawer" id="cart-drawer" hidden><div><header><h2>Your cart</h2><button id="close-cart" aria-label="Close cart">×</button></header><section id="cart-lines"></section><form id="checkout-form"><h3>Your details</h3><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone number<input name="phone" required></label><fieldset class="fulfilment-choice" id="fulfilment-choice"><legend>How would you like to receive this order?</legend><div id="fulfilment-options"></div></fieldset><div class="delivery-address" id="delivery-address" hidden><h3>Delivery address</h3><label>Address line 1<input name="line1"></label><label>Address line 2 <small>(optional)</small><input name="line2"></label><label>Town or city<input name="city"></label><label>UK postcode<input name="postcode" maxlength="8"></label></div><p class="fulfilment-note" id="fulfilment-note"></p><div class="checkout-totals" id="checkout-totals"></div><footer><strong id="cart-total"></strong><button class="button" type="submit" id="place-order">Place order →</button></footer></form><div id="order-success" hidden></div></div></div><script src="local-db.js?v=20"></script><script src="shop-fulfilment.js?v=1"></script><script src="image-downscale.js?v=1"></script><script src="masjid-shop.js?v=2"></script></body></html>
