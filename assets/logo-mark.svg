<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="MasjidPoint">
  <defs>
    <linearGradient id="lm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17513f"/>
      <stop offset="100%" stop-color="#0c3128"/>
    </linearGradient>
    <linearGradient id="lm-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d295"/>
      <stop offset="100%" stop-color="#c49a52"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="13" fill="url(#lm-bg)"/>

  <!-- dome, drawn as one confident arc so it stays legible at 20px -->
  <path d="M24 13c6.2 6 12.4 9.6 12.4 16.2 0 4.6-5.6 7.6-12.4 7.6s-12.4-3-12.4-7.6C11.6 22.6 17.8 19 24 13z" fill="url(#lm-gold)"/>
  <path d="M24 13c6.2 6 12.4 9.6 12.4 16.2 0 4.6-5.6 7.6-12.4 7.6z" fill="#000" opacity="0.08"/>

  <!-- crescent finial -->
  <g transform="translate(24 9.4)">
    <rect x="-0.8" y="-2" width="1.6" height="6" rx="0.8" fill="#f0d295"/>
    <path d="M0-8.6a4.6 4.6 0 1 0 3.2 7.9A3.6 3.6 0 1 1 0-8.6z" fill="#f0d295"/>
  </g>

  <!-- arched doorway, the "point" of the name -->
  <path d="M20.6 37V30a3.4 3.4 0 0 1 6.8 0v7z" fill="#0c3128"/>

  <!-- minarets -->
  <g fill="url(#lm-gold)" opacity="0.92">
    <rect x="8.4" y="24" width="3.4" height="13" rx="1.4"/>
    <rect x="36.2" y="24" width="3.4" height="13" rx="1.4"/>
    <path d="M10.1 24c-1.9 0-3-1.4-3-2.6 0-1.7 1.6-2.6 3-4.3 1.4 1.7 3 2.6 3 4.3 0 1.2-1.1 2.6-3 2.6z"/>
    <path d="M37.9 24c-1.9 0-3-1.4-3-2.6 0-1.7 1.6-2.6 3-4.3 1.4 1.7 3 2.6 3 4.3 0 1.2-1.1 2.6-3 2.6z"/>
  </g>

  <rect x="7" y="36.4" width="34" height="2.6" rx="1.3" fill="#f0d295" opacity="0.85"/>
</svg>
