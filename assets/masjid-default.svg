<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Masjid illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b5344"/>
      <stop offset="100%" stop-color="#0e3529"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f1e3"/>
      <stop offset="100%" stop-color="#e4dcc6"/>
    </linearGradient>
    <linearGradient id="domeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9b872"/>
      <stop offset="100%" stop-color="#b9924a"/>
    </linearGradient>
  </defs>

  <rect width="480" height="300" fill="url(#sky)"/>

  <!-- A soft halo behind the main dome -->
  <circle cx="240" cy="128" r="96" fill="#ffffff" opacity="0.05"/>
  <circle cx="240" cy="128" r="64" fill="#ffffff" opacity="0.05"/>

  <!-- Minarets -->
  <g fill="url(#stone)">
    <rect x="92" y="132" width="26" height="128" rx="5"/>
    <rect x="362" y="132" width="26" height="128" rx="5"/>
  </g>
  <g fill="url(#domeFill)">
    <path d="M105 132c-14 0-22-10-22-19 0-12 12-19 22-31 10 12 22 19 22 31 0 9-8 19-22 19z"/>
    <path d="M375 132c-14 0-22-10-22-19 0-12 12-19 22-31 10 12 22 19 22 31 0 9-8 19-22 19z"/>
  </g>
  <g fill="#f6f1e3" opacity="0.85">
    <rect x="88" y="158" width="34" height="4" rx="2"/>
    <rect x="358" y="158" width="34" height="4" rx="2"/>
  </g>

  <!-- Main hall -->
  <rect x="140" y="150" width="200" height="110" rx="7" fill="url(#stone)"/>

  <!-- Main dome -->
  <path d="M240 60c26 26 54 42 54 70 0 20-24 34-54 34s-54-14-54-34c0-28 28-44 54-70z" fill="url(#domeFill)"/>
  <path d="M240 60c26 26 54 42 54 70 0 20-24 34-54 34V60z" fill="#000000" opacity="0.06"/>

  <!-- Crescent finial -->
  <g transform="translate(240 44)">
    <rect x="-1.6" y="-4" width="3.2" height="18" rx="1.6" fill="#e8c887"/>
    <path d="M0-20a11 11 0 1 0 7.6 18.9A8.6 8.6 0 1 1 0-20z" fill="#e8c887"/>
  </g>

  <!-- Arched doorway and windows -->
  <path d="M225 260v-44a15 15 0 0 1 30 0v44z" fill="#123f35"/>
  <g fill="#123f35" opacity="0.82">
    <path d="M172 232v-24a11 11 0 0 1 22 0v24z"/>
    <path d="M286 232v-24a11 11 0 0 1 22 0v24z"/>
  </g>

  <!-- Small side domes -->
  <g fill="url(#domeFill)">
    <path d="M183 150c-13 0-21-9-21-17 0-11 11-17 21-28 10 11 21 17 21 28 0 8-8 17-21 17z" opacity="0.92"/>
    <path d="M297 150c-13 0-21-9-21-17 0-11 11-17 21-28 10 11 21 17 21 28 0 8-8 17-21 17z" opacity="0.92"/>
  </g>

  <!-- Ground line -->
  <rect x="76" y="258" width="328" height="6" rx="3" fill="#0b2a22" opacity="0.55"/>
</svg>
